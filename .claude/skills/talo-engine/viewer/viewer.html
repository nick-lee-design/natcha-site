<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Model viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F3; --panel:#FAFBFA; --ink:#1C2228; --muted:#57636E; --rule:#D5DBDF; --rule-strong:#97A2AC;
  --canvas:#E6EAE9; --accent:#C8136A; --accent-soft:rgba(200,19,106,.10); --clash:#D9361C; --warn:#A86A12; --ok:#2C7A4B; --focus:#2457D6;
  --tip:#1C2228; --tip-ink:#F2F4F3; --bwh:#0F8B8D; --prop:#7C3AED;
  --sans:"Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --cond:"Barlow Semi Condensed", "Arial Narrow", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1A2027; --panel:#1F262E; --ink:#E5E9EC; --muted:#9AA6B1; --rule:#313B46; --rule-strong:#59667372;
    --canvas:#242B34; --accent:#FF5BA6; --accent-soft:rgba(255,91,166,.14); --clash:#FF6A48; --warn:#E3A43A; --ok:#5EC08B; --focus:#86A9FF;
    --tip:#E5E9EC; --tip-ink:#1A2027; --bwh:#3CC4C6; --prop:#A98BFA; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1A2027; --panel:#1F262E; --ink:#E5E9EC; --muted:#9AA6B1; --rule:#313B46; --rule-strong:#596673;
  --canvas:#242B34; --accent:#FF5BA6; --accent-soft:rgba(255,91,166,.14); --clash:#FF6A48; --warn:#E3A43A; --ok:#5EC08B; --focus:#86A9FF;
  --tip:#E5E9EC; --tip-ink:#1A2027; --bwh:#3CC4C6; --prop:#A98BFA; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; overflow:hidden}
button,select,input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

#app{height:100%; display:grid; grid-template-rows:auto minmax(0,1fr); grid-template-columns:var(--lw,288px) minmax(0,1fr) var(--rw,360px)}
#app.noleft{--lw:0px} #app.noright{--rw:0px}
#app.noleft #left,#app.noright #right{display:none}

/* header */
#bar{grid-column:1/-1; display:flex; align-items:center; gap:18px; padding:8px 14px; border-bottom:1px solid var(--rule); background:var(--panel); flex-wrap:wrap; position:relative; z-index:5}
.ident h1{font-family:var(--cond); font-weight:600; font-size:19px; letter-spacing:.01em; margin:0; line-height:1.1}
.ident{min-width:0} .ident p{margin:0; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
@media (min-width: 1240px){ #bar{flex-wrap:nowrap} .tools{flex-wrap:nowrap} }
.views{display:flex; border:1px solid var(--rule-strong); border-radius:5px; overflow:hidden}
.views button{border:0; background:transparent; padding:5px 11px; cursor:pointer; font-family:var(--cond); font-weight:500; font-size:14px; border-right:1px solid var(--rule)}
.views button:last-child{border-right:0}
.views button.on{background:var(--ink); color:var(--paper)}
.tools{display:flex; align-items:center; gap:8px; margin-left:auto; flex-wrap:wrap}
.btn{border:1px solid var(--rule-strong); background:transparent; border-radius:5px; padding:5px 10px; cursor:pointer; font-family:var(--cond); font-weight:500; font-size:14px; white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.sel{display:flex; align-items:center; gap:5px; font-family:var(--cond); font-size:14px; color:var(--muted)}
.sel select{border:1px solid var(--rule-strong); border-radius:5px; background:var(--panel); padding:4px 6px; color:var(--ink); font-family:var(--cond); font-size:14px}

/* panels */
.panel{background:var(--panel); overflow-y:auto; overscroll-behavior:contain; min-height:0}
#left{border-right:1px solid var(--rule)}
#right{border-left:1px solid var(--rule); display:flex; flex-direction:column}
.sec{padding:14px 16px 16px; border-bottom:1px solid var(--rule)}
.sec h2{font-family:var(--cond); font-weight:600; font-size:16px; margin:0 0 10px; letter-spacing:.01em}
.sec h3{font-family:var(--cond); font-weight:600; font-size:15px; margin:18px 0 6px}
.sec p{margin:0 0 9px; max-width:62ch}
.small{font-size:12.5px; color:var(--muted)}
.rowbtns{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}

.layer{display:grid; grid-template-columns:18px 16px 1fr auto; gap:8px; align-items:center; padding:5px 0; cursor:pointer}
.layer input{margin:0; accent-color:var(--ink); width:15px; height:15px; cursor:pointer}
.sw{width:16px; height:16px; border-radius:3px; border:1px solid rgba(0,0,0,.18)}
.sw.line{height:0; border:0; border-top:3px solid; border-radius:0}
.sw.dash{height:0; border:0; border-top:2px dashed; border-radius:0}
.layer .nm{font-weight:500; line-height:1.2}
.layer .nm small{display:block; color:var(--muted); font-size:12px; font-weight:400}
.layer .code{font-family:var(--cond); font-size:12px; color:var(--muted)}
.layer .solo{border:0; background:none; font-family:var(--cond); font-size:12.5px; color:var(--muted); cursor:pointer; padding:2px 4px; border-radius:4px; text-decoration:underline; text-underline-offset:2px}
.layer .solo:hover{color:var(--ink)}
.layer.off .nm,.layer.off .code{opacity:.45}

.slider{display:grid; grid-template-columns:1fr auto; gap:2px 8px; margin:10px 0 4px; align-items:center}
.slider label{font-weight:500}
.slider output{font-family:var(--cond); color:var(--muted); font-variant-numeric:tabular-nums; font-size:13px}
.slider input{grid-column:1/-1; width:100%; accent-color:var(--ink)}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:0 12px}
.axis{margin-top:10px}
.axis .lab{display:flex; justify-content:space-between; font-weight:500}
.axis .lab span{font-family:var(--cond); font-weight:500; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums}
.axis input{width:100%; accent-color:var(--ink)}

/* tabs */
.tabs{display:flex; border-bottom:1px solid var(--rule); position:sticky; top:0; background:var(--panel); z-index:2}
.tabs button{flex:1; border:0; background:none; padding:11px 4px 9px; cursor:pointer; font-family:var(--cond); font-weight:500; font-size:14.5px; color:var(--muted); border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink); border-bottom-color:var(--ink)}
.tabpane{display:none} .tabpane.on{display:block}

dl.kv{display:grid; grid-template-columns:minmax(96px,auto) 1fr; gap:5px 12px; margin:0}
dl.kv dt{color:var(--muted); font-size:13px}
dl.kv dd{margin:0; overflow-wrap:anywhere}
.mark{font-family:var(--cond); font-weight:600; font-size:24px; line-height:1}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
.chip i{width:10px; height:10px; border-radius:2px; display:inline-block}
.sev{font-family:var(--cond); font-weight:600; font-size:12.5px; padding:1px 7px; border-radius:20px; border:1px solid currentColor; white-space:nowrap}
.sev.major{color:var(--clash)} .sev.minor{color:var(--warn)} .sev.touch{color:var(--muted)} .sev.penetration{color:var(--muted)} .sev.nohole{color:var(--prop)}
.sev.modelled{color:var(--bwh)} .sev.proposed{color:var(--prop)} .sev.ok{color:var(--ok)} .sev.tight{color:var(--warn)} .sev.clash{color:var(--clash)}
.views.filter{margin:10px 0 2px; width:max-content; max-width:100%}
.views.filter button{padding:4px 9px; font-size:13.5px}
.dimrow{display:grid; grid-template-columns:minmax(0,1fr) 112px 38px; gap:8px; align-items:center; padding:3px 0; font-size:13px; cursor:pointer}
.dimrow input{width:100%; margin:0; accent-color:var(--ink)}
.dimrow output{font-family:var(--cond); color:var(--muted); font-variant-numeric:tabular-nums; text-align:right}
.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.stat{border:1px solid var(--rule); border-radius:5px; padding:8px 10px; display:grid; gap:1px; min-width:0}
.stat span{font-size:12px; color:var(--muted)}
.stat b{font-family:var(--cond); font-weight:600; font-size:20px; line-height:1.15}
.stat small{font-size:12px; color:var(--muted); line-height:1.3}
.over{color:var(--clash); font-weight:600}
table.t td.chk{width:22px; padding-right:2px} table.t td.chk input{margin:0; accent-color:var(--ink); width:15px; height:15px; cursor:pointer}
.empty{color:var(--muted); padding:28px 16px}
.link{background:none; border:0; padding:0; color:var(--ink); text-decoration:underline; text-underline-offset:2px; cursor:pointer; font:inherit}
.link:hover{color:var(--accent)}

table.t{width:100%; border-collapse:collapse; font-size:13px; margin:4px 0 8px}
table.t th{font-family:var(--cond); font-weight:600; text-align:left; color:var(--muted); border-bottom:1px solid var(--rule-strong); padding:4px 6px 4px 0}
table.t td{border-bottom:1px solid var(--rule); padding:5px 6px 5px 0; vertical-align:top}
table.t td.n{font-variant-numeric:tabular-nums; text-align:right}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--accent-soft)}
.tablewrap{overflow-x:auto}

#search{width:100%; border:1px solid var(--rule-strong); border-radius:5px; padding:7px 9px; background:var(--paper)}
details.grp{border-bottom:1px solid var(--rule)}
details.grp summary{cursor:pointer; padding:9px 0; display:flex; justify-content:space-between; font-weight:500; list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::before{content:"+"; font-family:var(--cond); width:14px; color:var(--muted)}
details.grp[open] summary::before{content:"\2212"}
details.grp summary .nm{flex:1}
details.grp summary .ct{color:var(--muted); font-variant-numeric:tabular-nums}
.part{display:grid; grid-template-columns:78px 1fr; gap:8px; width:100%; text-align:left; border:0; background:none; padding:4px 4px 4px 14px; cursor:pointer; border-radius:4px; font-size:13px}
.part:hover,.part.on{background:var(--accent-soft)}
.part b{font-family:var(--cond); font-weight:600; font-size:14px}
.part span{color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* stage */
#stage{position:relative; min-width:0; min-height:0; background:var(--canvas); overflow:hidden}
#c{display:block; width:100%; height:100%; touch-action:none}
#labels{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.tag{position:absolute; left:0; top:0; pointer-events:auto; transform:translate(-50%,-120%); font-family:var(--cond); font-weight:600; font-size:12px; line-height:1; padding:3px 5px 3px 6px; background:var(--panel); color:var(--ink); border:1px solid var(--rule-strong); border-left:4px solid var(--c,#888); border-radius:3px; white-space:nowrap; cursor:pointer; display:none}
.tag:hover{border-color:var(--ink)}
.tag.cl{border-left-width:1px; background:var(--clash); color:#fff; border-color:var(--clash); border-radius:10px; padding:3px 7px}
.tag.cl.minor{background:var(--warn); border-color:var(--warn)}
.tag.cl.touch{background:var(--panel); color:var(--muted); border-color:var(--rule-strong)}
.tag.wx{border-left-width:1px; border-radius:10px; padding:2px 6px; font-size:11px; color:var(--muted)}
.tag.wx.nohole{color:var(--prop); border-color:var(--prop)}
#tip{position:absolute; pointer-events:none; background:var(--tip); color:var(--tip-ink); padding:6px 9px; border-radius:4px; font-size:12.5px; line-height:1.35; max-width:300px; display:none; z-index:4}
#tip b{font-family:var(--cond); font-weight:600; font-size:14px}
#hint{position:absolute; left:12px; bottom:10px; font-size:12px; color:var(--muted); pointer-events:none; max-width:calc(100% - 380px)}
#measureOut{position:absolute; left:12px; top:12px; background:var(--panel); border:1px solid var(--rule-strong); border-radius:5px; padding:8px 10px; font-size:13px; display:none; max-width:280px}
#measureOut b{font-family:var(--cond); font-size:18px; font-weight:600}
#loading{position:absolute; inset:0; display:grid; place-items:center; background:var(--canvas); color:var(--muted); font-family:var(--cond); font-size:16px; z-index:6; padding:24px; text-align:center}

/* title block: the drawing-sheet convention */
#titleblock{position:absolute; right:12px; bottom:12px; display:grid; grid-template-columns:auto auto auto; border:1.5px solid var(--ink); background:var(--panel); font-size:11.5px; line-height:1.25; max-width:calc(100% - 24px)}
#titleblock div{padding:4px 8px; border-right:1px solid var(--ink); border-bottom:1px solid var(--ink)}
#titleblock div:nth-child(3n){border-right:0}
#titleblock div.last{border-bottom:0}
#titleblock span{display:block; color:var(--muted); font-size:10.5px}
#titleblock strong{font-family:var(--cond); font-weight:600; font-size:13.5px}
#titleblock .wide{grid-column:1/-1; border-right:0}
#titleblock .wide strong{font-size:17px}

@media (max-width: 860px){
  body{font-size:14.5px}
  #app{grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto}
  #bar{min-width:0}
  #bar{gap:6px 8px; padding:6px 10px; flex-wrap:wrap}
  .ident h1{font-size:16px}
  .ident p{display:none}
  .views{order:3}
  .views button{padding:4px 9px}
  .tools{margin-left:0; width:100%; flex-wrap:nowrap; overflow-x:auto; order:4; padding-bottom:2px; scrollbar-width:none}
  .tools::-webkit-scrollbar{display:none}
  .btn{padding:4px 9px}
  .sel select{padding:3px 4px}
  .sel span.lbl{display:none}
  #left,#right{grid-column:1; grid-row:3; max-height:46vh; border:0; border-top:1px solid var(--rule)}
  #app.mshow-left #right, #app.mshow-right #left{display:none}
  #app:not(.mshow-left):not(.mshow-right) #left, #app:not(.mshow-left):not(.mshow-right) #right{display:none}
  #stage{grid-column:1; grid-row:2}
  #titleblock{display:none}
  #hint{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="ident">
      <h1>Model viewer</h1>
      <p></p>
    </div>
    <nav class="views" aria-label="Camera views">
      <button data-view="iso" class="on" title="3D view">3D</button>
      <button data-view="plan" title="Plan, looking down">Plan</button>
      <button data-view="below" title="From below, looking up at the ceiling void">Below</button>
      <button data-view="side" title="Long side, from the bottom edge of the plan">Side</button>
      <button data-view="end" title="End on, looking along the corridor">End</button>
    </nav>
    <div class="tools">
      <button class="btn" id="fitBtn" title="Fit the visible model (F fits the selection)">Fit</button>
      <button class="btn" id="projBtn" aria-pressed="false" title="Switch between perspective and orthographic">Orthographic</button>
      <label class="sel"><span class="lbl">Tags</span>
        <select id="tagSel" aria-label="Component tags"><option value="off" selected>None</option><option value="eq">Equipment</option><option value="bwh">Openings</option><option value="bwhxy">Openings with X, Y</option><option value="all">All parts</option></select></label>
      <label class="sel"><span class="lbl">Markers</span>
        <select id="mkSel" aria-label="Issue markers"><option value="off" selected>None</option><option value="cl">Clashes</option><option value="all">Clashes and walls</option></select></label>
      <button class="btn" id="boxBtn" aria-pressed="false">Section box</button>
      <button class="btn" id="measureBtn" aria-pressed="false" title="Click two points to measure">Measure</button>
      <button class="btn" id="modelTog" aria-pressed="true">Model</button>
      <button class="btn" id="inspTog" aria-pressed="true">Inspect</button>
    </div>
  </header>

  <aside id="left" class="panel" aria-label="Model controls">
    <section class="sec">
      <h2>Layers</h2>
      <div id="layerList"></div>
      <div class="rowbtns"><button class="btn" id="allLayers">Show all layers</button></div>
    </section>
    <section class="sec">
      <h2>Dim</h2>
      <div id="dimList"></div>
    </section>
    <section class="sec">
      <h2>Source models</h2>
      <div id="srcList"></div>
    </section>
    <section class="sec">
      <h2>Explode</h2>
      <div class="slider"><label for="exDisc">Separate disciplines</label><output id="exDiscOut">0%</output><input type="range" id="exDisc" min="0" max="100" value="0"></div>
      <div class="slider"><label for="exElem">Spread components</label><output id="exElemOut">0%</output><input type="range" id="exElem" min="0" max="100" value="0"></div>
      <p class="small" id="exNote"></p>
      <div class="rowbtns"><button class="btn" id="contractBtn">Contract</button></div>
    </section>
    <section class="sec">
      <h2>Section box</h2>
      <p class="small">Drag the arrows on the box, or the sliders below. Readouts are model coordinates in millimetres.</p>
      <div id="clipUI"></div>
      <div class="rowbtns"><button class="btn" id="clipReset">Reset box</button><button class="btn" id="clipSel">Box selection</button></div>
    </section>
  </aside>

  <main id="stage">
    <canvas id="c" aria-label="3D model view"></canvas>
    <div id="labels"></div>
    <div id="tip" role="status"></div>
    <div id="measureOut"></div>
    <div id="hint">Drag to orbit. Right-drag or two-finger drag to pan. Scroll or pinch to zoom. Click a part for details.</div>
    <div id="titleblock" aria-label="Drawing information"></div>
    <div id="loading">Loading model</div>
  </main>

  <aside id="right" class="panel" aria-label="Inspector">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="clash" class="on">Clashes</button>
      <button role="tab" data-tab="sel">Selection</button>
      <button role="tab" data-tab="parts">Parts</button>
      <button role="tab" data-tab="open">Openings</button>
      <button role="tab" data-tab="diag">Notes</button>
    </div>
    <div class="tabpane on" id="tab-clash"></div>
    <div class="tabpane" id="tab-sel"></div>
    <div class="tabpane" id="tab-parts">
      <div class="sec" style="position:sticky;top:44px;background:var(--panel);z-index:1;padding-bottom:10px">
        <input id="search" type="search" placeholder="Search mark, family, Revit ID or size" aria-label="Search parts">
      </div>
      <div id="partList" style="padding:0 12px 16px"></div>
    </div>
    <div class="tabpane" id="tab-open"></div>
    <div class="tabpane" id="tab-diag"></div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async function(){
"use strict";
const $ = s => document.querySelector(s);
const loading = $('#loading');
if (!window.THREE || !THREE.OrbitControls){ loading.textContent = 'The 3D library did not load. Check the connection and reload the page.'; return; }
// the model and everything found in it come from a data package: corridor.json plus the geometry chunks it names
const pkgUrl = new URL(new URLSearchParams(location.search).get('package') || 'ncw-corridor/corridor.json', location.href);
const TYPED = {uint16:Uint16Array, uint32:Uint32Array, int32:Int32Array, float32:Float32Array};
let P, CH;
try{
  const res = await fetch(pkgUrl);
  if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
  P = await res.json();
  if (P.format !== 'talo-model-package' || P.version !== 1) throw new Error('not a version 1 model package');
  // one chunk per system for now, later one per system and level; all fetched together
  CH = await Promise.all(P.geometry.map(async K => {
    const gr = await fetch(new URL(K.uri, pkgUrl));
    if (!gr.ok) throw new Error(K.uri + ' ' + gr.status + ' ' + gr.statusText);
    let buf = await gr.arrayBuffer();
    // a server may already have undone the gzip in transit
    const u8 = new Uint8Array(buf, 0, Math.min(2, buf.byteLength));
    if (u8[0] === 0x1f && u8[1] === 0x8b) buf = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    const block = (b, n) => new TYPED[b.type](buf, b.byteOffset, n);
    return {id:K.id, origin:K.positions.origin || [0,0,0], step:K.positions.step ?? 1,
      pos:block(K.positions, K.positions.count*3), idx:block(K.indices, K.indices.count), lines:K.lines ? block(K.lines, K.lines.count*3) : null};
  }));
}catch(err){
  loading.textContent = 'The model could not be loaded (' + err.message + '). Reload the page, or open it in a current Chrome, Edge, Firefox or Safari.';
  return;
}
const chIx = Object.fromEntries(CH.map((K, k) => [K.id, k]));

/* ---------- reference data, all from the package ---------- */
if (!P.layers.some(L => L.role === 'opening'))
  P.layers.push({id:'BWH', name:'Builders’ work holes', desc:'Modelled and proposed openings', colour:'#0F8B8D', role:'opening', proposedColour:'#7C3AED'});
const LAYER = Object.fromEntries(P.layers.map(L => [L.id, {col:L.colour, name:L.name, desc:L.desc || '', role:L.role, op:L.opacity ?? 1}]));

function slabSection(i, ax, a0, a1){

function svcSection(i, ax, a0, a1){

}
// clearance of each service to the opening edge, and the verdict against the rule
function clearance(o){
  const [u,v] = crossAx(o.ax), a0 = o.s0, a1 = o.s1;
  const cu = (o.b[u]+o.b[u+3])/2, cv = (o.b[v]+o.b[v+3])/2;

    let g;

      const R = o.dia/2, su = (r[0]+r[1])/2, sv = (r[2]+r[3])/2;
      g = R - (Math.hypot(su-cu, sv-cv) + Math.max(r[1]-r[0], r[3]-r[2])/2);
    } else g = Math.min(r[0]-o.b[u], o.b[u+3]-r[1], r[2]-o.b[v], o.b[v+3]-r[3]);
    return {i, g, need:isDamper(E[i]) ? 0 : NEED[E[i].g]};

const ray0 = new THREE.Raycaster();
function spansAlong(pt, ax, from, to, walls){
  const o = pt.slice(); o[ax] = from;
  const dir = new THREE.Vector3(); dir.setComponent(ax, 1);
  ray0.set(new THREE.Vector3(mmToW(o[0],0), mmToW(o[1],1), mmToW(o[2],2)), dir); ray0.far = (to-from)/1000;
  const ts = walls.flatMap(w => ray0.intersectObject(meshes[w], false).map(h => from + h.distance*1000)).sort((a,b) => a-b);
  const spans = [];
  for (const t of ts){ const s = spans[spans.length-1]; if (s && t - s[1] < 250) s[1] = t; else spans.push([t,t]); }
  return spans.filter(s => s[1]-s[0] >= 12 && s[1]-s[0] <= 450);
}
// a service passes through an opening when the centre of its section in the wall lies inside the opening
function passes(o, i){

function loadOpenings(){

      services:r.services.map(ref), walls:r.walls.map(ref), crossings:r.crossings.slice(), dampers:(r.dampers || []).map(ref), verdict:r.verdict, review:r.reviewStatus, flags:r.reviewFlags || [],

// no openings in the package: find them here. Modelled holes take their axis and depth from the wall; services with no hole get a proposed one
function proposeOpenings(){
  // modelled holes: the wall span sets the through axis and depth; services are what passes through that slab
  for (const h of E.filter(d => d.g === 'BWH')){
    const hb = h.b, circ = /Circular/i.test(h.f || '');
    const dims = [0,1,2].map(ax => hb[ax+3]-hb[ax]), cen = [0,1,2].map(ax => (hb[ax]+hb[ax+3])/2);
    const walls = [...new Set(CL.filter(c => c.sev === 'penetration' && c.hole === h.i).map(c => c.b))];
    if (!walls.length) E.filter(d => d.k === 'wall' && boxHit(d.b, hb)).forEach(d => walls.push(d.i));
    const spanAt = ax => spansAlong(cen, ax, cen[ax]-700, cen[ax]+700, walls).find(s => s[0]-30 < cen[ax] && s[1]+30 > cen[ax]);
    let ax = circ ? [0,1,2].find(k => { const [j1,j2] = crossAx(k); return Math.abs(dims[j1]-dims[j2]) < 2; }) : undefined;
    if (ax === undefined){

const labelLayer = $('#labels');
const pool = []; let poolUsed = 0;
function getLabel(){

    el.addEventListener('click', ev => { ev.stopPropagation(); const k = el.dataset.k; if (k[0]==='e') selectEl(+k.slice(1), true); else selectClash(k.slice(1), true); });

const v3 = new THREE.Vector3();

function placeLabels(){

      else { const tries = [0,-20,20,-40,40,-60]; dy = tries.find(t => fits(s[0]-wd/2, s[1]-ht-4+t, wd, ht)); if (dy === undefined) dy = 0; }
      const el = getLabel();
      el.className = 'tag ' + (pen ? 'wx' + (c.open != null && E[c.open].prop ? ' nohole' : '') : 'cl ' + c.sev);
      el.textContent = c.id; el.dataset.k = 'c' + c.id;
      el.title = pen ? (c.open == null ? 'Service runs along a wall' : 'Wall crossing, ' + (E[c.open].prop ? 'proposed opening ' : 'modelled hole ') + E[c.open].m) : (c.sev[0].toUpperCase()+c.sev.slice(1)) + ' clash: ' + A.m + ' and ' + B.m;

  }
}

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
function pick(cx, cy){
  const r = canvas.getBoundingClientRect();
  ndc.set(((cx - r.left)/r.width)*2-1, -((cy - r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, cam);
  const vis = meshes.filter(m => m.visible);
  const hits = ray.intersectObjects(vis, false);
  for (const h of hits){
    if (!insideClip(h.point)) continue;
    const d = E[h.object.userData.i];
    if (layerOp[d.l] < 0.6 && hits.some(o => o !== h && layerOp[E[o.object.userData.i].l] >= 0.6 && insideClip(o.point))) continue;
    const pref = st.bwhIso || (st.ghost && st.focus);
    if (pref && !pref.has(d.i)){
      const f = hits.find(o => pref.has(o.object.userData.i) && insideClip(o.point));
      if (f) return {d:E[f.object.userData.i], point:f.point.clone()};
    }
    return {d, point:h.point.clone()};
  }
  return null;
}

/* clash report: a printable page with an image of every clash, captured offscreen */
let shot = null;
function stamp(src, marks, camera, r){
  const cv = document.createElement('canvas'); cv.width = src.width; cv.height = src.height;
  const g = cv.getContext('2d'); g.drawImage(src, 0, 0);
  g.font = `600 ${r > 16 ? 22 : 15}px "Barlow Semi Condensed", Arial, sans-serif`; g.textBaseline = 'middle';
  for (const m of marks){
    const v = m.p.clone().project(camera); if (v.z > 1) continue;
    const x = (v.x+1)/2*cv.width, y = (1-v.y)/2*cv.height;
    g.lineWidth = r > 16 ? 3 : 2; g.strokeStyle = m.col; g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.stroke();
    const w = g.measureText(m.label).width + 12, hh = r > 16 ? 28 : 20;
    g.fillStyle = m.col; g.fillRect(x + r + 3, y - hh/2, w, hh); g.fillStyle = '#fff'; g.fillText(m.label, x + r + 9, y);
  }
  return cv.toDataURL('image/jpeg', 0.86);
}
const clashPoint = c => new THREE.Vector3(mmToW(c.p[0],0), mmToW(c.p[1],1), mmToW(c.p[2],2)).add(E[c.a].off);

  shot.setSize(W, H, false);
  shot.setClearColor('#E6EAE9'); shot.localClippingEnabled = false;
  const keep = {sel:st.sel, selClash:st.selClash, ghost:st.ghost, hover:st.hover, m:mLine.visible, dots:mDots.map(s => s.visible)};
  boxHelper.visible = false; handles.forEach(g => g.visible = false); mLine.visible = false; mDots.forEach(s => s.visible = false);
  st.sel = null; st.hover = null; st.ghost = true;
  const pc = new THREE.PerspectiveCamera(38, W/H, 0.01, 400); pc.up.set(0,0,1);
  const dir = new THREE.Vector3(...VIEWS.iso).normalize(), out = {};
  for (const c of list){
    st.selClash = c; refresh();
    const p = clashPoint(c), r = Math.max(Math.max(...c.ov)/1000*0.9, 0.45);
    pc.position.copy(p).addScaledVector(dir, r / Math.sin(THREE.MathUtils.degToRad(19))); pc.lookAt(p); pc.updateMatrixWorld();
    shot.render(scene, pc);
    out[c.id] = stamp(shot.domElement, [{p, label:c.id, col:SEV_COL[c.sev]}], pc, 26);
  }
  // overview: the corridor from above with every clash in the report
  st.selClash = null; refresh();
  // sized to the corridor's proportions so the plan fills the image
  const OW = 1600, OH = Math.max(360, Math.min(1000, Math.round(OW * (W1.y-W0.y)/(W1.x-W0.x) * 1.12)));
  shot.setSize(OW, OH, false);
  const cx = (W0.x+W1.x)/2, cy = (W0.y+W1.y)/2, half = Math.max((W1.y-W0.y)/2, (W1.x-W0.x)/2/(OW/OH))*1.04;
  const oc = new THREE.OrthographicCamera(-half*OW/OH, half*OW/OH, half, -half, -400, 400); oc.up.set(0,1,0);
  oc.position.set(cx, cy, 50); oc.lookAt(cx, cy, 0); oc.updateMatrixWorld();
  shot.render(scene, oc);
  out.overview = stamp(shot.domElement, list.map(c => ({p:clashPoint(c), label:c.id, col:SEV_COL[c.sev]})), oc, 9);
  Object.assign(st, {sel:keep.sel, selClash:keep.selClash, ghost:keep.ghost, hover:keep.hover});
  mLine.visible = keep.m; mDots.forEach((s, k) => s.visible = keep.dots[k]);
  refresh(); applyClip();
  return out;
}

      OPEN.filter(i => E[i].prop).map(i => { const o = E[i].bwh; return `<tr class="click" data-el="${i}"><td><b>${esc(E[i].m)}</b></td><td>${o.services.map(k => esc(E[k].m)).join(', ')} <span class="small">${esc(E[o.services[0]].c)}</span></td><td>${o.walls.map(w => esc(E[w].m)).join(', ')}</td></tr>`; }).join('')),
    inventory:() => wrap('<th>Category</th><th>Layer</th><th class="n">Count</th>',
      cats.map(c => { const d = E.find(x => x.c === c); return `<tr class="click" data-cat="${esc(c)}"><td><span class="chip" style="color:inherit"><i style="background:${LAYER[layerOf(d)].col}"></i>${esc(c)}</span></td><td class="small">${esc(layerOf(d))}</td><td class="n">${catCount[c]}</td></tr>`; }).join(''))
  };
  // [[MARK]] links a part, [[tab:id|Label]] opens a tab
  const text = t => esc(t).replace(/\[\[tab:([\w-]+)\|([^\]]+)\]\]/g, '<button class="link" data-tabgo="$1">$2</button>')
    .replace(/\[\[([^\]|]+)\]\]/g, '<button class="link" data-mk="$1">$1</button>');
  const block = b => b.h3 != null ? `<h3>${text(b.h3)}</h3>` : b.p != null ? `<p>${text(b.p)}</p>` : b.small != null ? `<p class="small">${text(b.small)}</p>`
    : b.table && TABLE[b.table] ? TABLE[b.table]() : '';
  const notes = P.notes || [];
  $('#tab-diag').innerHTML = notes.length ? notes.map(s => `<section class="sec"><h2>${esc(s.heading)}</h2>${(s.blocks || []).map(block).join('\n')}</section>`).join('\n')
    : '<div class="empty">No notes for this model.</div>';
  $('#tab-diag').addEventListener('click', e => {
    const t = e.target.closest('[data-cl],[data-el],[data-mk],[data-cat],[data-tabgo]'); if (!t) return;
    if (t.dataset.tabgo) return showTab(t.dataset.tabgo);
    if (t.dataset.cl) return selectClash(t.dataset.cl, true);
    if (t.dataset.el) return selectEl(+t.dataset.el, true);
    if (t.dataset.mk){ const d = E.find(x => x.m === t.dataset.mk || x.m === t.dataset.mk.replace(/-(\d)$/,'-0$1')); if (d) selectEl(d.i, true); return; }
    if (t.dataset.cat){ showTab('parts'); const g = document.querySelector(`#partList details[data-cat="${CSS.escape(t.dataset.cat)}"]`); if (g){ g.open = true; g.scrollIntoView({block:'start'}); } }
  });
}

/* ---------- title block ---------- */
function buildTitle(){
  // {parts}, {sectionBox} and a grade id such as {major} are filled from the model
  const vals = {parts:nFile, sectionBox:[0,1,2].map(ax => ((M.bmax[ax]-M.bmin[ax])/1000).toFixed(1)).join(' × ') + ' m'};
  GRADES.forEach(g => vals[g.id] = SVC_CL.filter(c => c.sev === g.id).length);
  const fill = v => String(v ?? '').replace(/\{(\w+)\}/g, (m, k) => k in vals ? vals[k] : m);
  const items = P.titleBlock || [], wide = items.filter(x => x.wide), rest = items.filter(x => !x.wide), nLast = rest.length % 3 || 3;
  const cell = (x, cls) => `<div${cls ? ` class="${cls}"` : ''}><span>${esc(x.label)}</span><strong>${esc(fill(x.value))}</strong></div>`;
  $('#titleblock').innerHTML = wide.map(x => cell(x, 'wide')).join('') + rest.map((x, k) => cell(x, k >= rest.length - nLast ? 'last' : '')).join('');
  if (!items.length) $('#titleblock').style.display = 'none';
}

/* ---------- header wiring ---------- */
document.querySelectorAll('.views button').forEach(b => b.addEventListener('click', () => {
  const v = b.dataset.view;
  if (v !== 'iso' && cam !== ortho) setProjection(true);
  if (v === 'iso' && cam === ortho) setProjection(false);
  setView(v);
}));
$('#fitBtn').onclick = () => { if (st.sel != null) zoomToEl(st.sel); else fitTo(visibleBounds()); };
$('#projBtn').onclick = () => setProjection(cam !== ortho);
$('#tagSel').onchange = e => { st.tags = e.target.value; req(); };
$('#mkSel').onchange = e => { st.markers = e.target.value; req(); };
$('#measureBtn').onclick = () => setMeasure(!st.measure);
$('#boxBtn').onclick = () => setBox(!st.boxOn);
const mobile = () => matchMedia('(max-width: 860px)').matches;
function syncPanelBtns(){
  if (mobile()){ $('#modelTog').setAttribute('aria-pressed', String(app.classList.contains('mshow-left'))); $('#inspTog').setAttribute('aria-pressed', String(app.classList.contains('mshow-right'))); }
  else { $('#modelTog').setAttribute('aria-pressed', String(!app.classList.contains('noleft'))); $('#inspTog').setAttribute('aria-pressed', String(!app.classList.contains('noright'))); }
}
$('#modelTog').onclick = () => { if (mobile()){ const on = app.classList.toggle('mshow-left'); if (on) app.classList.remove('mshow-right'); } else app.classList.toggle('noleft'); syncPanelBtns(); };
$('#inspTog').onclick = () => { if (mobile()){ const on = app.classList.toggle('mshow-right'); if (on) app.classList.remove('mshow-left'); } else app.classList.toggle('noright'); syncPanelBtns(); };
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
$('#exDisc').addEventListener('input', e => { st.exDisc = +e.target.value/100; $('#exDiscOut').textContent = e.target.value + '%'; applyExplode(); });
$('#exElem').addEventListener('input', e => { st.exElem = +e.target.value/100; $('#exElemOut').textContent = e.target.value + '%'; applyExplode(); });
$('#contractBtn').onclick = () => {
  const a0 = st.exDisc, b0 = st.exElem, t0 = performance.now(), dur = reduceMotion ? 0 : 450;
  const step = now => { const k = dur ? Math.min(1,(now-t0)/dur) : 1; st.exDisc = a0*(1-k); st.exElem = b0*(1-k); applyExplode();
    $('#exDisc').value = Math.round(st.exDisc*100); $('#exElem').value = Math.round(st.exElem*100); $('#exDiscOut').textContent = $('#exDisc').value+'%'; $('#exElemOut').textContent = $('#exElem').value+'%';
    if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
};
window.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.key === 'Escape'){ if (st.measure) setMeasure(false); else clearSelection(); }
  if (e.key === 'f' || e.key === 'F'){ $('#fitBtn').click(); }
  if ((e.key === 'h' || e.key === 'H') && st.sel != null){ st.hidden.add(st.sel); st.sel = null; refresh(); renderSel(); showIsoBanner(); }
  if ((e.key === 'i' || e.key === 'I') && st.sel != null){ st.isolate = new Set([st.sel]); refresh(); zoomToEl(st.sel); showIsoBanner(); }
});
const themeMQ = matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  renderer.setClearColor(new THREE.Color(cssVar('--canvas') || '#E6EAE9'));
  const dk = dark();
  for (const L of M.line_layers) lineObjs[L].material.color.set(dk ? LINES[L].dark : LINES[L].col);
  req();
}
themeMQ.addEventListener ? themeMQ.addEventListener('change', applyTheme) : themeMQ.addListener(applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

/* ---------- go ---------- */
buildLayers(); buildDim(); buildClipUI(); buildParts(); buildDiag(); buildTitle(); renderOpenings(); renderClashes(); renderSel(); applyClip(); applyTheme();
if (mobile()){ app.classList.remove('noleft','noright'); st.tags = 'off'; $('#tagSel').value = 'off'; st.markers = 'off'; $('#mkSel').value = 'off'; }
syncPanelBtns();
resize(); refresh();
const startBox = new THREE.Box3(W0.clone(), W1.clone());
{ const fb = frameBox(startBox, new THREE.Vector3(...VIEWS.iso).normalize()); controls.target.copy(fb.c); persp.position.copy(fb.pos); controls.update(); }
loading.remove();
window.__viewer = {st, E, OPEN, CL, fireFor, selectEl, selectClash, setView, setProjection, applyExplode, req, setBox, descOf, clashText, TRIAGE, handles, camera:() => cam};
requestAnimationFrame(frame);
})();
</script>
</body>
