<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Model viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F3; --panel:#FAFBFA; --ink:#1C2228; --muted:#57636E; --rule:#D5DBDF; --rule-strong:#97A2AC;
  --canvas:#E6EAE9; --accent:#C8136A; --accent-soft:rgba(200,19,106,.10); --clash:#D9361C; --warn:#A86A12; --ok:#2C7A4B; --focus:#2457D6;
  --tip:#1C2228; --tip-ink:#F2F4F3; --bwh:#0F8B8D; --prop:#7C3AED;
  --sans:"Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --cond:var(--sans);
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1A2027; --panel:#1F262E; --ink:#E5E9EC; --muted:#9AA6B1; --rule:#313B46; --rule-strong:#59667372;
    --canvas:#242B34; --accent:#FF5BA6; --accent-soft:rgba(255,91,166,.14); --clash:#FF6A48; --warn:#E3A43A; --ok:#5EC08B; --focus:#86A9FF;
    --tip:#E5E9EC; --tip-ink:#1A2027; --bwh:#3CC4C6; --prop:#A98BFA; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1A2027; --panel:#1F262E; --ink:#E5E9EC; --muted:#9AA6B1; --rule:#313B46; --rule-strong:#596673;
  --canvas:#242B34; --accent:#FF5BA6; --accent-soft:rgba(255,91,166,.14); --clash:#FF6A48; --warn:#E3A43A; --ok:#5EC08B; --focus:#86A9FF;
  --tip:#E5E9EC; --tip-ink:#1A2027; --bwh:#3CC4C6; --prop:#A98BFA; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; overflow:hidden}
button,select,input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

#app{height:100%; display:grid; grid-template-rows:auto minmax(0,1fr); grid-template-columns:var(--lw,288px) minmax(0,1fr) var(--rw,360px)}
#app.noleft{--lw:0px} #app.noright{--rw:0px}
#app.noleft #left,#app.noright #right{display:none}

/* header */
#bar{grid-column:1/-1; display:flex; align-items:center; gap:18px; padding:8px 14px; border-bottom:1px solid var(--rule); background:var(--panel); flex-wrap:wrap; position:relative; z-index:5}
.ident h1{font-family:var(--cond); font-weight:600; font-size:18px; letter-spacing:-.02em; margin:0; line-height:1.1}
.ident{min-width:0} .ident p{margin:0; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
@media (min-width: 1240px){ #bar{flex-wrap:nowrap} .tools{flex-wrap:nowrap} }
.views{display:flex; flex:none; border:1px solid var(--rule-strong); border-radius:5px; overflow:hidden}
.views button{border:0; background:transparent; padding:5px 10px; cursor:pointer; font-family:var(--cond); font-weight:500; font-size:13px; border-right:1px solid var(--rule)}
.views button:last-child{border-right:0}
.views button.on{background:var(--ink); color:var(--paper)}
.tools{display:flex; align-items:center; gap:8px; margin-left:auto; flex-wrap:wrap}
.btn{border:1px solid var(--rule-strong); background:transparent; border-radius:5px; padding:5px 10px; cursor:pointer; font-family:var(--cond); font-weight:500; font-size:13px; white-space:nowrap}
.btn:disabled{opacity:.45; cursor:default}
.btn[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.sel{display:flex; align-items:center; gap:5px; font-family:var(--cond); font-size:13px; color:var(--muted)}
.sel select{border:1px solid var(--rule-strong); border-radius:5px; background:var(--panel); padding:4px 6px; color:var(--ink); font-family:var(--cond); font-size:13px}

/* panels */
.panel{background:var(--panel); overflow-y:auto; overscroll-behavior:contain; min-height:0}
#left{border-right:1px solid var(--rule)}
#right{border-left:1px solid var(--rule); display:flex; flex-direction:column}
.sec{padding:14px 16px 16px; border-bottom:1px solid var(--rule)}
.sec h2{font-family:var(--cond); font-weight:600; font-size:16px; margin:0 0 10px; letter-spacing:.01em}
.sec h3{font-family:var(--cond); font-weight:600; font-size:15px; margin:18px 0 6px}
.sec p{margin:0 0 9px; max-width:62ch}
.small{font-size:12.5px; color:var(--muted)}
.rowbtns{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}

.layer{display:grid; grid-template-columns:18px 16px 1fr auto; gap:8px; align-items:center; padding:5px 0; cursor:pointer}
.layer input{margin:0; accent-color:var(--ink); width:15px; height:15px; cursor:pointer}
.sw{width:16px; height:16px; border-radius:3px; border:1px solid rgba(0,0,0,.18)}
.sw.line{height:0; border:0; border-top:3px solid; border-radius:0}
.sw.dash{height:0; border:0; border-top:2px dashed; border-radius:0}
.layer .nm{font-weight:500; line-height:1.2}
.layer .nm small{display:block; color:var(--muted); font-size:12px; font-weight:400}
.layer .code{font-family:var(--mono); font-size:11px; color:var(--muted)}
.layer .solo{border:0; background:none; font-family:var(--cond); font-size:12.5px; color:var(--muted); cursor:pointer; padding:2px 4px; border-radius:4px; text-decoration:underline; text-underline-offset:2px}
.layer .solo:hover{color:var(--ink)}
.layer.off .nm,.layer.off .code{opacity:.45}

.slider{display:grid; grid-template-columns:1fr auto; gap:2px 8px; margin:10px 0 4px; align-items:center}
.slider label{font-weight:500}
.slider output{font-family:var(--cond); color:var(--muted); font-variant-numeric:tabular-nums; font-size:13px}
.slider input{grid-column:1/-1; width:100%; accent-color:var(--ink)}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:0 12px}
.axis{margin-top:10px}
.axis .lab{display:flex; justify-content:space-between; font-weight:500}
.axis .lab span{font-family:var(--cond); font-weight:500; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums}
.axis input{width:100%; accent-color:var(--ink)}

/* tabs */
.tabs{display:flex; border-bottom:1px solid var(--rule); position:sticky; top:0; background:var(--panel); z-index:2}
.tabs button{flex:1; border:0; background:none; padding:11px 2px 9px; cursor:pointer; font-family:var(--cond); font-weight:500; font-size:13px; color:var(--muted); border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink); border-bottom-color:var(--ink)}
.tabpane{display:none} .tabpane.on{display:block}

dl.kv{display:grid; grid-template-columns:minmax(96px,auto) 1fr; gap:5px 12px; margin:0}
dl.kv dt{color:var(--muted); font-size:13px}
dl.kv dd{margin:0; overflow-wrap:anywhere}
.mark{font-family:var(--mono); font-weight:700; font-size:21px; line-height:1}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
.chip i{width:10px; height:10px; border-radius:2px; display:inline-block}
.sev{font-family:var(--cond); font-weight:600; font-size:12.5px; padding:1px 7px; border-radius:20px; border:1px solid currentColor; white-space:nowrap}
.sev.major{color:var(--clash)} .sev.minor{color:var(--warn)} .sev.touch{color:var(--muted)} .sev.penetration{color:var(--muted)} .sev.nohole{color:var(--prop)}
.sev.modelled{color:var(--bwh)} .sev.proposed{color:var(--prop)} .sev.ok{color:var(--ok)} .sev.tight{color:var(--warn)} .sev.clash{color:var(--clash)}
.views.filter{margin:10px 0 2px; width:max-content; max-width:100%}
.views.filter button{padding:4px 9px; font-size:13.5px}
.dimrow{display:grid; grid-template-columns:minmax(0,1fr) 112px 38px; gap:8px; align-items:center; padding:3px 0; font-size:13px; cursor:pointer}
.dimrow input{width:100%; margin:0; accent-color:var(--ink)}
.dimrow output{font-family:var(--cond); color:var(--muted); font-variant-numeric:tabular-nums; text-align:right}
.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.stat{border:1px solid var(--rule); border-radius:5px; padding:8px 10px; display:grid; gap:1px; min-width:0}
.stat span{font-size:12px; color:var(--muted)}
.stat b{font-family:var(--sans); font-weight:600; font-size:20px; line-height:1.15; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.stat small{font-size:12px; color:var(--muted); line-height:1.3}
.over{color:var(--clash); font-weight:600}
table.t td.chk{width:22px; padding-right:2px} table.t td.chk input{margin:0; accent-color:var(--ink); width:15px; height:15px; cursor:pointer}
.empty{color:var(--muted); padding:28px 16px}
.link{background:none; border:0; padding:0; color:var(--ink); text-decoration:underline; text-underline-offset:2px; cursor:pointer; font:inherit}
.link:hover{color:var(--accent)}

table.t{width:100%; border-collapse:collapse; font-size:13px; margin:4px 0 8px}
table.t th{font-family:var(--cond); font-weight:600; text-align:left; color:var(--muted); border-bottom:1px solid var(--rule-strong); padding:4px 6px 4px 0}
table.t td{border-bottom:1px solid var(--rule); padding:5px 6px 5px 0; vertical-align:top}
table.t td.n{font-variant-numeric:tabular-nums; text-align:right}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--accent-soft)}
.tablewrap{overflow-x:auto}

#search{width:100%; border:1px solid var(--rule-strong); border-radius:5px; padding:7px 9px; background:var(--paper)}
details.grp{border-bottom:1px solid var(--rule)}
details.grp summary{cursor:pointer; padding:9px 0; display:flex; justify-content:space-between; font-weight:500; list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::before{content:"+"; font-family:var(--cond); width:14px; color:var(--muted)}
details.grp[open] summary::before{content:"\2212"}
details.grp summary .nm{flex:1}
details.grp summary .ct{color:var(--muted); font-variant-numeric:tabular-nums}
.part{display:grid; grid-template-columns:78px 1fr; gap:8px; width:100%; text-align:left; border:0; background:none; padding:4px 4px 4px 14px; cursor:pointer; border-radius:4px; font-size:13px}
.part:hover,.part.on{background:var(--accent-soft)}
.part b{font-family:var(--mono); font-weight:500; font-size:12.5px}
.part span{color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* stage */
#stage{position:relative; min-width:0; min-height:0; background:var(--canvas); overflow:hidden}
#c{display:block; width:100%; height:100%; touch-action:none}
#labels{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.tag{position:absolute; left:0; top:0; pointer-events:auto; transform:translate(-50%,-120%); font-family:var(--mono); font-weight:500; font-size:11.5px; line-height:1; padding:3px 5px 3px 6px; background:var(--panel); color:var(--ink); border:1px solid var(--rule-strong); border-left:4px solid var(--c,#888); border-radius:3px; white-space:nowrap; cursor:pointer; display:none}
.tag:hover{border-color:var(--ink)}
.tag.cl{border-left-width:1px; background:var(--clash); color:#fff; border-color:var(--clash); border-radius:10px; padding:3px 7px}
.tag.cl.minor{background:var(--warn); border-color:var(--warn)}
.tag.cl.touch{background:var(--panel); color:var(--muted); border-color:var(--rule-strong)}
.tag.wx{border-left-width:1px; border-radius:10px; padding:2px 6px; font-size:11px; color:var(--muted)}
.tag.wx.nohole{color:var(--prop); border-color:var(--prop)}
#tip{position:absolute; pointer-events:none; background:var(--tip); color:var(--tip-ink); padding:6px 9px; border-radius:4px; font-size:12.5px; line-height:1.35; max-width:300px; display:none; z-index:4}
#tip b{font-family:var(--cond); font-weight:600; font-size:14px}
#hint{position:absolute; left:12px; bottom:10px; font-size:12px; color:var(--muted); pointer-events:none; max-width:calc(100% - 380px)}
#measureOut{position:absolute; left:12px; top:12px; background:var(--panel); border:1px solid var(--rule-strong); border-radius:5px; padding:8px 10px; font-size:13px; display:none; max-width:280px}
#measureOut b{font-family:var(--cond); font-size:18px; font-weight:600}
#loading{position:absolute; inset:0; display:grid; place-items:center; background:var(--canvas); color:var(--muted); font-family:var(--cond); font-size:16px; z-index:6; padding:24px; text-align:center}

/* title block: the drawing-sheet convention */
#titleblock{position:absolute; right:12px; bottom:12px; display:grid; grid-template-columns:auto auto auto; border:1.5px solid var(--ink); background:var(--panel); font-size:11.5px; line-height:1.25; max-width:calc(100% - 24px)}
#titleblock div{padding:4px 8px; border-right:1px solid var(--ink); border-bottom:1px solid var(--ink)}
#titleblock div:nth-child(3n){border-right:0}
#titleblock div.last{border-bottom:0}
#titleblock span{display:block; color:var(--muted); font-size:10.5px}
#titleblock strong{font-family:var(--cond); font-weight:600; font-size:13.5px}
#titleblock .wide{grid-column:1/-1; border-right:0}
#titleblock .wide strong{font-size:17px}

/* levels: one button per storey down the side of the model; hovering previews the storey in the section box */
#levels{position:absolute; left:12px; top:12px; bottom:40px; z-index:3; display:flex; flex-direction:column; width:96px; background:var(--panel); border:1px solid var(--rule-strong); border-radius:6px; overflow:hidden}
#levels h2{font-size:12px; font-weight:600; color:var(--muted); margin:0; padding:8px 10px 6px; border-bottom:1px solid var(--rule)}
#levels .list{overflow-y:auto; overscroll-behavior:contain; flex:1; padding:2px 0}
#levels button{display:flex; justify-content:space-between; align-items:baseline; gap:6px; width:100%; border:0; background:none; padding:4px 10px; cursor:pointer; text-align:left; font-size:13px; font-weight:500}
#levels button:hover,#levels button.hot{background:var(--accent-soft)}
#levels button.on{background:var(--ink); color:var(--paper)}
#levels button small{font-family:var(--mono); font-size:10.5px; color:var(--muted); font-weight:400}
#levels button.on small{color:inherit; opacity:.7}
#levels button.none:not(.on){color:var(--muted); font-weight:400}
#levels .all{border-bottom:1px solid var(--rule); padding:6px 10px}
#stage.has-levels #measureOut,#stage.has-levels #hint{left:120px}
#stage.has-levels #hint{max-width:calc(100% - 500px)}

/* find a room or part */
.find{flex:none}
.find input{width:190px; border:1px solid var(--rule-strong); border-radius:5px; padding:5px 9px; background:var(--panel); font-size:13px}
.pop{position:fixed; z-index:30; display:none; background:var(--panel); border:1px solid var(--rule-strong); border-radius:6px; box-shadow:0 10px 28px rgba(0,0,0,.18); padding:4px}
#findList{width:340px; max-height:380px; overflow-y:auto}
#findList button{display:grid; grid-template-columns:auto minmax(0,1fr); gap:1px 10px; width:100%; text-align:left; border:0; background:none; padding:6px 8px; border-radius:4px; cursor:pointer; font-size:13px}
#findList button:hover,#findList button.on{background:var(--accent-soft)}
#findList b{font-family:var(--mono); font-weight:500; font-size:12px}
#findList span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#findList small{grid-column:2; color:var(--muted); font-size:11.5px}
#findList p{margin:0; padding:6px 8px; color:var(--muted); font-size:12px}

/* report downloads */
#repMenu{min-width:290px}
#repMenu button{display:flex; justify-content:space-between; align-items:baseline; gap:18px; width:100%; border:0; background:none; padding:8px 10px; border-radius:4px; cursor:pointer; text-align:left; font-size:13.5px}
#repMenu button:hover:not(:disabled),#repMenu button:focus-visible{background:var(--accent-soft)}
#repMenu button:disabled{color:var(--muted); cursor:default}
#repMenu small{color:var(--muted); font-size:11.5px; font-family:var(--mono); white-space:nowrap}

/* saved views */
.vcard{display:grid; grid-template-columns:112px minmax(0,1fr); gap:8px 12px; padding:12px 16px; border-bottom:1px solid var(--rule)}
.vcard.flag{box-shadow:inset 3px 0 0 var(--clash)}
.vcard img{width:112px; height:70px; object-fit:cover; border-radius:4px; border:1px solid var(--rule); cursor:pointer; background:var(--canvas); display:block}
.vcard .vname{width:100%; border:1px solid transparent; background:none; font-weight:600; padding:2px 4px; margin:-3px 0 2px -5px; border-radius:4px}
.vcard .vname:hover,.vcard .vname:focus{border-color:var(--rule-strong)}
.vcard .meta{font-size:12px; color:var(--muted)}
.vcard .flagged{color:var(--clash); font-weight:600}
.vcard textarea{grid-column:1/-1; width:100%; min-height:52px; border:1px solid var(--rule-strong); border-radius:5px; padding:6px 8px; background:var(--paper); font:inherit; font-size:13px; resize:vertical}
.vcard .rowbtns{grid-column:1/-1; margin-top:0}
#shared{position:absolute; left:50%; top:12px; transform:translateX(-50%); z-index:4; display:none; align-items:center; gap:10px; max-width:calc(100% - 260px); background:var(--panel); border:1px solid var(--rule-strong); border-radius:6px; padding:6px 8px 6px 12px; font-size:13px; box-shadow:0 6px 18px rgba(0,0,0,.12)}
#shared .note{color:var(--clash); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#busy{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:7; display:none; background:var(--panel); border:1px solid var(--rule-strong); border-radius:6px; padding:12px 16px; font-size:13.5px; box-shadow:0 10px 28px rgba(0,0,0,.18)}
#toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:40; display:none; background:var(--tip); color:var(--tip-ink); border-radius:5px; padding:8px 12px; font-size:13px}

@media (max-width: 860px){
  body{font-size:14.5px}
  #app{grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto}
  #bar{min-width:0}
  #bar{gap:6px 8px; padding:6px 10px; flex-wrap:wrap}
  .ident h1{font-size:16px}
  .ident p{display:none}
  .views{order:3}
  .views button{padding:4px 9px}
  .tools{margin-left:0; width:100%; flex-wrap:nowrap; overflow-x:auto; order:4; padding-bottom:2px; scrollbar-width:none}
  .tools::-webkit-scrollbar{display:none}
  .btn{padding:4px 9px}
  .sel select{padding:3px 4px}
  .sel span.lbl{display:none}
  #left,#right{grid-column:1; grid-row:3; max-height:46vh; border:0; border-top:1px solid var(--rule)}
  #app.mshow-left #right, #app.mshow-right #left{display:none}
  #app:not(.mshow-left):not(.mshow-right) #left, #app:not(.mshow-left):not(.mshow-right) #right{display:none}
  #stage{grid-column:1; grid-row:2}
  #titleblock{display:none}
  #hint{display:none}
  .find input{width:150px}
  #levels{width:76px; bottom:12px}
  #stage.has-levels #measureOut{left:96px}
  #shared{max-width:calc(100% - 110px); left:auto; right:8px; transform:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="ident">
      <h1>Model viewer</h1>
      <p></p>
    </div>
    <nav class="views" aria-label="Camera views">
      <button data-view="iso" class="on" title="3D view">3D</button>
      <button data-view="plan" title="Plan, looking down">Plan</button>
      <button data-view="below" title="From below, looking up at the ceiling void">Below</button>
      <button data-view="side" title="Long side, from the bottom edge of the plan">Side</button>
      <button data-view="end" title="End on, looking along the corridor">End</button>
    </nav>
    <div class="find"><input id="find" type="search" placeholder="Find a part" aria-label="Find a room or part" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="findList"></div>
    <div class="tools">
      <button class="btn" id="fitBtn" title="Fit the visible model (F fits the selection)">Fit</button>
      <button class="btn" id="projBtn" aria-pressed="false" title="Switch between perspective and orthographic">Orthographic</button>
      <label class="sel"><span class="lbl">Tags</span>
        <select id="tagSel" aria-label="Component tags"><option value="off" selected>None</option><option value="eq">Equipment</option><option value="bwh">Openings</option><option value="bwhxy">Openings with X, Y</option><option value="all">All parts</option></select></label>
      <label class="sel"><span class="lbl">Markers</span>
        <select id="mkSel" aria-label="Issue markers"><option value="off" selected>None</option><option value="cl">Clashes</option><option value="all">Clashes and walls</option></select></label>
      <button class="btn" id="boxBtn" aria-pressed="false">Section box</button>
      <button class="btn" id="measureBtn" aria-pressed="false" title="Click two points to measure">Measure</button>
      <button class="btn" id="repBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="repMenu">Download reports</button>
      <button class="btn" id="modelTog" aria-pressed="true">Model</button>
      <button class="btn" id="inspTog" aria-pressed="true">Inspect</button>
    </div>

<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async function(){
"use strict";
const $ = s => document.querySelector(s);
const loading = $('#loading');
if (!window.THREE || !THREE.OrbitControls){ loading.textContent = 'The 3D library did not load. Check the connection and reload the page.'; return; }
// the model and everything found in it come from a data package: corridor.json plus the geometry chunks it names
const pkgUrl = new URL(new URLSearchParams(location.search).get('package') || 'ncw-corridor/corridor.json', location.href);
const TYPED = {uint16:Uint16Array, uint32:Uint32Array, int32:Int32Array, float32:Float32Array};
let P, CH;
try{
  const res = await fetch(pkgUrl);
  if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
  P = await res.json();
  if (P.format !== 'talo-model-package' || P.version !== 1) throw new Error('not a version 1 model package');
  // one chunk per system for now, later one per system and level; all fetched together
  CH = await Promise.all(P.geometry.map(async K => {
    const gr = await fetch(new URL(K.uri, pkgUrl));
    if (!gr.ok) throw new Error(K.uri + ' ' + gr.status + ' ' + gr.statusText);
    let buf = await gr.arrayBuffer();
    // a server may already have undone the gzip in transit
    const u8 = new Uint8Array(buf, 0, Math.min(2, buf.byteLength));
    if (u8[0] === 0x1f && u8[1] === 0x8b) buf = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    const block = (b, n) => new TYPED[b.type](buf, b.byteOffset, n);
    return {id:K.id, origin:K.positions.origin || [0,0,0], step:K.positions.step ?? 1,
      pos:block(K.positions, K.positions.count*3), idx:block(K.indices, K.indices.count), lines:K.lines ? block(K.lines, K.lines.count*3) : null};
  }));
}catch(err){
  loading.textContent = 'The model could not be loaded (' + err.message + '). Reload the page, or open it in a current Chrome, Edge, Firefox or Safari.';
  return;
}
const chIx = Object.fromEntries(CH.map((K, k) => [K.id, k]));

/* ---------- reference data, all from the package ---------- */
if (!P.layers.some(L => L.role === 'opening'))
  P.layers.push({id:'BWH', name:'Builders’ work holes', desc:'Modelled and proposed openings', colour:'#0F8B8D', role:'opening', proposedColour:'#7C3AED'});
const LAYER = Object.fromEntries(P.layers.map(L => [L.id, {col:L.colour, name:L.name, desc:L.desc || '', role:L.role, op:L.opacity ?? 1}]));
const LINES = Object.fromEntries((P.lineLayers || []).map(L => [L.id, {col:L.colour, dark:L.darkColour || L.colour, name:L.name, desc:L.desc || '', dash:!!L.dash, model:L.model, disc:L.discipline}]));
const HOST = (P.models.find(m => m.role === 'host') || P.models[0]).id;
const SRC = Object.fromEntries(P.models.map(m => [m.id, {name:m.name || m.label, desc:m.desc || [m.number, m.rev].filter(Boolean).join(', '), reviewer:m.reviewer}]));
const MODELS = P.models.map(m => m.id).filter(id => P.elements.some(e => e.model === id));
const TYPES = P.partTypes || [];
const typeRole = Object.fromEntries(TYPES.filter(t => t.role).map(t => [t.name, t.role]));
const EQUIP = new Set(TYPES.filter(t => t.equipment).map(t => t.name));
const CAT_ORDER = TYPES.map(t => t.name);
const DISC = Object.fromEntries(P.disciplines.map(d => [d.id, d.explode || 0]));
const NEED = Object.fromEntries(P.disciplines.filter(d => d.clearance != null).map(d => [d.id, d.clearance]));   // clearance all round, mm
const SYS = Object.fromEntries((P.pipeSystems || []).map(s => [s.name, s]));
const SYSTEM = Object.fromEntries((P.systems || []).map(s => [s.id, s.name]));
const ZONE = Object.fromEntries((P.zones || []).map(z => [z.id, z.name]));
const zoneName = z => ZONE[z] || 'Zone ' + z;
// a clash is placed by its zone, or by its level and grid reference when the package gives those instead
const placeOf = c => c.zone != null ? zoneName(c.zone) : [c.level, c.grid && 'Grid ' + c.grid].filter(Boolean).join(', ') || 'Location not recorded';
const R_CL = P.rules.clash, R_OPEN = P.rules.openings;
const BWH_KEY = P.layers.find(L => L.role === 'opening').id;
const BWH_MOD = (TYPES.find(t => t.role === 'opening') || {}).name || 'Builders’ work hole, modelled';
const BWH_PROP = (TYPES.find(t => t.role === 'proposed-opening') || {}).name || 'Builders’ work hole, proposed';
const PROP_COL = P.layers.find(L => L.role === 'opening').proposedColour || '#7C3AED';
const isDamper = d => typeRole[d.c] === 'fire-damper';
// the model version every report and image carries: the project's revision, or the source file's date and a short hash of it
const SRCF = P.project.source || {};
const longDate = t => new Date(t).toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});
const VERSION = P.project.revision ? 'Revision ' + P.project.revision
  : [SRCF.file, SRCF.modified && 'saved ' + longDate(SRCF.modified), SRCF.sha256 && 'file ' + SRCF.sha256.slice(0, 8)].filter(Boolean).join(', ') || 'Not recorded';
// storeys, lowest first, and the structural grid, both read from the model
const LEVELS = (P.levels || []).slice().sort((a, b) => a.elevation - b.elevation);
const LEVEL = Object.fromEntries(LEVELS.map(L => [L.id, L]));
const levelName = id => id == null ? '' : LEVEL[id]?.name || id;
const GRID = (P.grid || []).map(g => {
  // gridlines are drawn either way round: point each one up or right, so the side a point is on means the same for every line in a family
  const along = Math.abs(g.b[1]-g.a[1]) > Math.abs(g.b[0]-g.a[0]);
  let d = [g.b[0]-g.a[0], g.b[1]-g.a[1]]; if (along ? d[1] < 0 : d[0] < 0) d = [-d[0], -d[1]];
  const n = Math.hypot(d[0], d[1]) || 1;
  return {label:g.label, a:g.a, n:[-d[1]/n, d[0]/n], along};
});
// 'C–D / 4': the gridlines either side of a point in each direction, or the one it sits on
function gridRef(x, y){
  const out = [];
  for (const fam of [GRID.filter(g => g.along), GRID.filter(g => !g.along)]){
    const d = fam.filter(g => g.label).map(g => [(x-g.a[0])*g.n[0] + (y-g.a[1])*g.n[1], g.label]).sort((a, b) => a[0]-b[0]);
    if (!d.length) continue;
    const on = d.find(v => Math.abs(v[0]) < 300); if (on){ out.push(on[1]); continue; }
    const neg = d.filter(v => v[0] < 0), pos = d.filter(v => v[0] > 0);
    out.push(neg.length && pos.length ? [neg[neg.length-1][1], pos[0][1]].sort().join('–') : 'outside ' + (neg.length ? neg[neg.length-1][1] : pos[0][1]));
  }
  return out.join(' / ');
}

// the package's readable fields, mapped onto the short names the viewer works with; parts are referred to by id
const layerIx = Object.fromEntries(P.layers.map((L, l) => [L.id, l]));
const idIx = Object.fromEntries(P.elements.map((e, i) => [e.id, i]));
const ref = id => id == null ? undefined : idIx[id];
// framing and the section box work on the model's core, so one stray part far away (listed in Notes) doesn't shrink the building to a dot
const CORE = P.bounds.core || P.bounds;
const M = {
  centre:CORE.min.map((v, k) => (v + CORE.max[k])/2), bmin:CORE.min, bmax:CORE.max,
  layers:P.layers.map(L => L.id), line_layers:Object.keys(LINES),
  lines:(P.lineLayers || []).map(L => ({layer:L.id, ch:chIx[L.chunk ?? CH[0].id], off:L.offset, n:L.count})),
  links:P.models.filter(m => m.role === 'link'), dups:(P.duplicates || []).map(d => ({mep:ref(d.mep), arch:ref(d.arch), dz:d.dz, dxy:d.dxy})),
  elements:P.elements.map((e, i) => ({i, id:e.id, m:e.mark, l:layerIx[e.layer], g:LAYER[e.layer].role === 'opening' ? 'BWH' : e.discipline, s:e.model, sys:e.system, c:e.type, k:e.kind, z:e.size,
    b:e.bbox, ch:chIx[e.mesh.chunk ?? CH[0].id], vo:e.mesh.vertexOffset, vc:e.mesh.vertexCount, io:e.mesh.indexOffset, ic:e.mesh.indexCount, nf:e.faces, np:e.plates,
    f:e.family, t:e.familyType, r:e.revitId, sy:e.pipeSystem, ss:e.pipeSystemFrom, il:e.insertedOn, hasins:ref(e.insulation), ins:ref(e.insulates), desc:e.description, fr:e.fireRating, lv:e.level, cat0:e.category})),
  clashes:[...(P.clashes || []).map(c => ({id:c.id, a:ref(c.a), b:ref(c.b), sev:c.grade, p:c.point, ov:c.overlap, n:c.contacts, pair:c.pair, hole:null, zone:c.zone, level:c.level, grid:c.grid, depth:c.depth, measure:c.measure})),
           ...(P.wallCrossings || []).map(c => ({id:c.id, a:ref(c.service), b:ref(c.wall), sev:'penetration', p:c.point, ov:c.overlap, n:c.contacts, pair:c.pair, hole:c.hole == null ? null : ref(c.hole), openRef:c.opening}))]
};
const E = M.elements;
const CL = M.clashes;
const byId = {}; CL.forEach(c => byId[c.id] = c);
const elClashes = {}; CL.forEach(c => { (elClashes[c.a] ||= []).push(c); (elClashes[c.b] ||= []).push(c); });
const dupOf = {}; M.dups.forEach(d => { dupOf[d.mep] = d; dupOf[d.arch] = d; });

/* builders' work holes have their own layer; proposed ones are added once the meshes exist */
const BWH_L = layerIx[BWH_KEY];
document.title = P.project.name + ', model viewer';
$('.ident h1').textContent = P.project.name;
$('.ident p').textContent = P.project.subtitle || '';
$('#exNote').textContent = P.ui?.explodeNote || '';
const nFile = E.length;

const fmt = n => Math.round(n).toLocaleString('en-GB');
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const lc = s => /^[A-Z][a-z]/.test(s) ? s[0].toLowerCase() + s.slice(1) : s;     // "Architectural link" reads lower case mid-sentence, "MEP model" keeps its capitals
const layerOf = d => M.layers[d.l];
const dark = () => getComputedStyle(document.documentElement).colorScheme.includes('dark');
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- three setup ---------- */
const stage = $('#stage'), canvas = $('#c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
const persp = new THREE.PerspectiveCamera(38, 1, 0.01, 400);
const ortho = new THREE.OrthographicCamera(-1,1,1,-1,-400,400);
persp.up.set(0,0,1); ortho.up.set(0,0,1);
let cam = persp;
const controls = new THREE.OrbitControls(persp, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.12; controls.screenSpacePanning = true;

const hemi = new THREE.HemisphereLight(0xffffff, 0x6b7280, 0.62); hemi.position.set(0,0,1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.62); sun.position.set(0.5,-0.9,1.2); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.28); fill.position.set(-0.7,0.6,-0.4); scene.add(fill);

const C = M.centre;
const toW = (K,q,ax) => (q*K.step + K.origin[ax] - C[ax]) / 1000;           // quantised -> world metres
const mmToW = (v,ax) => (v - C[ax]) / 1000;                    // model mm -> world metres
const wToMm = (v,ax) => v*1000 + C[ax];

const clipPlanes = [new THREE.Plane(new THREE.Vector3(1,0,0), 1e3), new THREE.Plane(new THREE.Vector3(-1,0,0), 1e3),
                    new THREE.Plane(new THREE.Vector3(0,1,0), 1e3), new THREE.Plane(new THREE.Vector3(0,-1,0), 1e3),
                    new THREE.Plane(new THREE.Vector3(0,0,1), 1e3), new THREE.Plane(new THREE.Vector3(0,0,-1), 1e3)];

function mkMat(col, extra={}){ return new THREE.MeshPhongMaterial(Object.assign({color:col, flatShading:true, shininess:14, side:THREE.DoubleSide, clippingPlanes:clipPlanes}, extra)); }
const layerMat = M.layers.map(L => mkMat(LAYER[L].col));
const hoverMat = M.layers.map(L => mkMat(LAYER[L].col, {emissive:new THREE.Color(LAYER[L].col).multiplyScalar(0.55)}));
const selMat = mkMat('#C8136A', {emissive:new THREE.Color('#5a0430')});
const pairMat = mkMat('#E0391F', {emissive:new THREE.Color('#4a1006')});
const dupMat = mkMat('#C8136A', {transparent:true, opacity:0.45, depthWrite:false});
const ghostMat = M.layers.map(L => mkMat(LAYER[L].col, {transparent:true, opacity:0.11, depthWrite:false}));
const bwhMat = {modelled:mkMat(LAYER[BWH_KEY].col, {transparent:true, opacity:0.62, depthWrite:false}),
                proposed:mkMat(PROP_COL, {transparent:true, opacity:0.58, depthWrite:false})};
const bwhHover = {modelled:mkMat(LAYER[BWH_KEY].col, {emissive:new THREE.Color(LAYER[BWH_KEY].col).multiplyScalar(0.55)}),
                  proposed:mkMat(PROP_COL, {emissive:new THREE.Color(PROP_COL).multiplyScalar(0.55)})};
const bwhEdge = {modelled:new THREE.LineBasicMaterial({color:'#0A5E60', clippingPlanes:clipPlanes}),
                 proposed:new THREE.LineBasicMaterial({color:'#4C1D95', clippingPlanes:clipPlanes})};
const greyMat = mkMat('#9AA3AB', {transparent:true, opacity:0.12, depthWrite:false});
const WALLS = new Set(M.layers.map((L, l) => LAYER[L].role === 'wall' ? l : -1).filter(l => l >= 0));
// every layer can be dimmed; each starts at its package opacity
const layerOp = M.layers.map(L => LAYER[L].op);
function setLayerOpacity(l, a){
  [layerMat[l], hoverMat[l]].forEach(m => { m.transparent = a < 0.99; m.opacity = a; m.depthWrite = a >= 0.99; m.needsUpdate = true; });
  if (l === BWH_L){ bwhMat.modelled.opacity = 0.62*a; bwhMat.proposed.opacity = 0.58*a; }
}
layerOp.forEach((a, l) => setLayerOpacity(l, a));

/* meshes */
const meshes = [];
const group = new THREE.Group(); scene.add(group);
for (const d of E){
  const pos = new Float32Array(d.vc*3);
  const K = CH[d.ch], POS = K.pos;
  for (let k=0;k<d.vc;k++){ const p=(d.vo+k)*3; pos[k*3]=toW(K,POS[p],0); pos[k*3+1]=toW(K,POS[p+1],1); pos[k*3+2]=toW(K,POS[p+2],2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setIndex(new THREE.BufferAttribute(K.idx.slice(d.io, d.io+d.ic),1));
  g.computeBoundingSphere(); g.computeBoundingBox();
  const m = new THREE.Mesh(g, layerMat[d.l]);
  m.userData.i = d.i;
  if (WALLS.has(d.l)) m.renderOrder = 2;
  if (d.g === 'BWH') m.renderOrder = 3;
  group.add(m); meshes.push(m);
  d.cw = new THREE.Vector3(mmToW((d.b[0]+d.b[3])/2,0), mmToW((d.b[1]+d.b[4])/2,1), mmToW((d.b[2]+d.b[5])/2,2));
  d.off = new THREE.Vector3();
  d.cat = d.c;
  d.stray = [0,1,2].some(ax => (d.b[ax]+d.b[ax+3])/2 < CORE.min[ax] - 1000 || (d.b[ax]+d.b[ax+3])/2 > CORE.max[ax] + 1000);
}
/* lines */
const lineObjs = {};
for (const L of M.lines){
  const arr = new Float32Array(L.n*3);
  const K = CH[L.ch], LPOS = K.lines;
  for (let k=0;k<L.n;k++){ const p=(L.off+k)*3; arr[k*3]=toW(K,LPOS[p],0); arr[k*3+1]=toW(K,LPOS[p+1],1); arr[k*3+2]=toW(K,LPOS[p+2],2); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(arr,3));
  const st = LINES[L.layer];
  const mat = st.dash ? new THREE.LineDashedMaterial({color:st.col, dashSize:0.08, gapSize:0.05, transparent:true, opacity:.9})
                      : new THREE.LineBasicMaterial({color:st.col, clippingPlanes:clipPlanes, transparent:true, opacity:.85});
  const obj = new THREE.LineSegments(g, mat); if (st.dash) obj.computeLineDistances();
  scene.add(obj); lineObjs[L.layer] = obj;
}
/* section box outline (live) */
const boxHelper = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)), new THREE.LineBasicMaterial({color:'#C8136A', transparent:true, opacity:.7}));
boxHelper.visible = false; scene.add(boxHelper);
/* measure line */
const mGeom = new THREE.BufferGeometry(); mGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6),3));
const mLine = new THREE.Line(mGeom, new THREE.LineBasicMaterial({color:'#C8136A', depthTest:false, transparent:true}));
mLine.renderOrder = 10; mLine.visible = false; scene.add(mLine);
const mDots = [0,1].map(() => { const s = new THREE.Mesh(new THREE.SphereGeometry(0.018,12,8), new THREE.MeshBasicMaterial({color:'#C8136A', depthTest:false})); s.renderOrder=11; s.visible=false; scene.add(s); return s; });

/* model extents in world */
const W0 = new THREE.Vector3(mmToW(M.bmin[0],0), mmToW(M.bmin[1],1), mmToW(M.bmin[2],2));
const W1 = new THREE.Vector3(mmToW(M.bmax[0],0), mmToW(M.bmax[1],1), mmToW(M.bmax[2],2));

/* ---------- builders' work holes ---------- */
const AXN = ['X','Y','Z'];
const isService = d => NEED[d.g] != null && typeRole[d.c] !== 'insulation' && typeRole[d.c] !== 'support';
const crossAx = ax => ax === 2 ? [0,1] : [ax === 0 ? 1 : 0, 2];
const boxHit = (a, b, t=0) => [0,1,2].every(ax => a[ax] < b[ax+3]-t && a[ax+3] > b[ax]+t);
const roundUp = v => Math.ceil(v/R_OPEN.roundTo)*R_OPEN.roundTo;
// a service's cross-section within a slab along ax, from its vertices; the whole bounding box when no vertex falls inside
function slabSection(i, ax, a0, a1){
  const p = meshes[i].geometry.attributes.position.array, [u,v] = crossAx(ax);
  const r = [Infinity,-Infinity,Infinity,-Infinity];
  for (let k=0; k<p.length; k+=3){
    const t = wToMm(p[k+ax], ax); if (t < a0 || t > a1) continue;
    const pu = wToMm(p[k+u], u), pv = wToMm(p[k+v], v);
    if (pu < r[0]) r[0] = pu; if (pu > r[1]) r[1] = pu; if (pv < r[2]) r[2] = pv; if (pv > r[3]) r[3] = pv;
  }
  const b = E[i].b;
  return (r[1]-r[0] > 5 && r[3]-r[2] > 5) ? r : [b[u], b[u+3], b[v], b[v+3]];
}
// section of a service plus its insulation
function svcSection(i, ax, a0, a1){
  const r = slabSection(i, ax, a0, a1), d = E[i];
  if (d.hasins == null) return r;
  const q = slabSection(d.hasins, ax, a0, a1);
  return [Math.min(r[0],q[0]), Math.max(r[1],q[1]), Math.min(r[2],q[2]), Math.max(r[3],q[3])];

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
function pick(cx, cy){

  const vis = meshes.filter(m => m.visible);
  const hits = ray.intersectObjects(vis, false);
  for (const h of hits){
    if (!insideClip(h.point)) continue;
    const d = E[h.object.userData.i];
    if (layerOp[d.l] < 0.6 && hits.some(o => o !== h && layerOp[E[o.object.userData.i].l] >= 0.6 && insideClip(o.point))) continue;
    const pref = st.bwhIso || (st.ghost && st.focus);
    if (pref && !pref.has(d.i)){
      const f = hits.find(o => pref.has(o.object.userData.i) && insideClip(o.point));
      if (f) return {d:E[f.object.userData.i], point:f.point.clone()};
    }
    return {d, point:h.point.clone()};
  }

}

/* clash report: a printable page with an image of every clash, captured offscreen */
let shot = null;
function stamp(src, marks, camera, r){
  const cv = document.createElement('canvas'); cv.width = src.width; cv.height = src.height;
  const g = cv.getContext('2d'); g.drawImage(src, 0, 0);
  g.font = `500 ${r > 16 ? 19 : 13}px "JetBrains Mono", monospace`; g.textBaseline = 'middle';
  for (const m of marks){
    const v = m.p.clone().project(camera); if (v.z > 1) continue;
    const x = (v.x+1)/2*cv.width, y = (1-v.y)/2*cv.height;
    if (!m.label){ g.fillStyle = m.col; g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill(); continue; }
    g.lineWidth = r > 16 ? 3 : 2; g.strokeStyle = m.col; g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.stroke();
    const w = g.measureText(m.label).width + 12, hh = r > 16 ? 28 : 20;
    g.fillStyle = m.col; g.fillRect(x + r + 3, y - hh/2, w, hh); g.fillStyle = '#fff'; g.fillText(m.label, x + r + 9, y);
  }
  return cv.toDataURL('image/jpeg', 0.86);
}
const clashPoint = c => new THREE.Vector3(mmToW(c.p[0],0), mmToW(c.p[1],1), mmToW(c.p[2],2)).add(E[c.a].off);
// a close-up of each clash with everything else faded, and a plan of them all, drawn offscreen a few at a time
async function clashImages(cards, all, progress){
  const W = 960, H = 600;
  if (!shot){ shot = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true}); shot.setPixelRatio(1); }
  shot.setClearColor('#E6EAE9'); shot.localClippingEnabled = false;
  const keep = {sel:st.sel, selClash:st.selClash, ghost:st.ghost, hover:st.hover, m:mLine.visible, dots:mDots.map(s => s.visible)};
  capturing = true;
  boxHelper.visible = false; handles.forEach(g => g.visible = false); mLine.visible = false; mDots.forEach(s => s.visible = false);
  st.sel = null; st.hover = null; st.ghost = true;
  const pc = new THREE.PerspectiveCamera(38, W/H, 0.01, 400); pc.up.set(0,0,1);
  const dir = new THREE.Vector3(...VIEWS.iso).normalize(), out = {}, sc = new THREE.Vector3();
  try{
    shot.setSize(W, H, false);
    for (let k = 0; k < cards.length; k++){
      const c = cards[k];
      st.selClash = c; refresh();
      const p = clashPoint(c), r = Math.max(Math.max(...c.ov)/1000*0.9, 0.45), reach = r * 6;
      // only what is near the clash is drawn, which keeps a large model quick
      meshes.forEach(m => { if (m.visible){ const sp = m.geometry.boundingSphere; m.visible = sc.copy(sp.center).add(m.position).distanceTo(p) - sp.radius < reach; } });
      pc.near = Math.max(0.01, r / 50); pc.far = reach * 4; pc.updateProjectionMatrix();
      pc.position.copy(p).addScaledVector(dir, r / Math.sin(THREE.MathUtils.degToRad(19))); pc.lookAt(p); pc.updateMatrixWorld();
      shot.render(scene, pc);
      out[c.id] = stamp(shot.domElement, [{p, label:c.id, col:SEV_COL[c.sev]}], pc, 22);
      if (k % 3 === 2){ progress?.(k + 1, cards.length); await new Promise(res => setTimeout(res)); }
    }
    // the plan: the model from above with every clash in the report; labelled when there are few enough to read
    st.selClash = null; refresh();
    const OW = 1600, OH = Math.max(500, Math.min(2000, Math.round(OW * (W1.y-W0.y)/(W1.x-W0.x) * 1.08)));
    shot.setSize(OW, OH, false);
    const cx = (W0.x+W1.x)/2, cy = (W0.y+W1.y)/2, half = Math.max((W1.y-W0.y)/2, (W1.x-W0.x)/2/(OW/OH))*1.04;
    const oc = new THREE.OrthographicCamera(-half*OW/OH, half*OW/OH, half, -half, -REACH*2, REACH*2); oc.up.set(0,1,0);
    oc.position.set(cx, cy, W1.z + 5); oc.lookAt(cx, cy, W0.z); oc.updateMatrixWorld();
    shot.render(scene, oc);
    out.overview = {src:stamp(shot.domElement, all.map(c => ({p:clashPoint(c), label:all.length <= 60 ? c.id : '', col:SEV_COL[c.sev]})), oc, all.length <= 60 ? 9 : 5), w:OW, h:OH};
  } finally {
    Object.assign(st, {sel:keep.sel, selClash:keep.selClash, ghost:keep.ghost, hover:keep.hover});
    mLine.visible = keep.m; mDots.forEach((s, k) => s.visible = keep.dots[k]);
    capturing = false; refresh(); applyClip();
  }
  return out;
}

/* clash report: a PDF in Inter, with the report date and model version on every page */
const loadScript = src => new Promise((ok, no) => { const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = () => no(new Error('could not load ' + src.split('/').pop())); document.head.appendChild(el); });
const fontData = {};
async function pdfDoc(){
  if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  if (!window.jspdf.jsPDF.API.autoTable) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  const doc = new window.jspdf.jsPDF({unit:'mm', format:'a4', compress:true});
  // the fonts sit beside the viewer
  for (const [file, style] of [['Inter-Regular.ttf', 'normal'], ['Inter-SemiBold.ttf', 'bold']]){
    if (!fontData[file]){
      const r = await fetch(new URL('fonts/' + file, location.href)); if (!r.ok) throw new Error(file + ' ' + r.status);
      const u8 = new Uint8Array(await r.arrayBuffer()); let bin = '';
      for (let k = 0; k < u8.length; k += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(k, k + 0x8000));
      fontData[file] = btoa(bin);
    }
    doc.addFileToVFS(file, fontData[file]); doc.addFont(file, 'Inter', style);
  }
  doc.setFont('Inter', 'normal');
  return doc;
}
const rgb = c => { const m = /^#?([0-9a-f]{6})$/i.exec(c || ''); return m ? [0,2,4].map(k => parseInt(m[1].slice(k, k+2), 16)) : [28,34,40]; };

    ? `<button role="option" data-k="${k}"><b>${esc(h.room.number || '')}</b><span>${esc(h.room.name || 'Room')}</span><small>Room${h.room.level ? ' · ' + esc(levelName(h.room.level)) : ''}</small></button>`
    : `<button role="option" data-k="${k}"><b>${esc(h.part.m)}</b><span>${esc(descOf(h.part))}</span><small>${esc([h.part.c, levelName(h.part.lv)].filter(Boolean).join(' · '))}</small></button>`).join('')
    + (findHits.length ? '' : '<p>Nothing matches.</p>') + (ROOMS.length ? '' : '<p>No rooms in this export.</p>');
  const r = findIn.getBoundingClientRect();
  findList.style.left = Math.max(8, Math.min(r.left, innerWidth - 348)) + 'px'; findList.style.top = (r.bottom + 4) + 'px';
  findList.style.display = 'block'; findIn.setAttribute('aria-expanded', 'true'); markFind();
}
function markFind(){ findList.querySelectorAll('[data-k]').forEach(b => b.classList.toggle('on', +b.dataset.k === findOn)); findList.querySelector('.on')?.scrollIntoView({block:'nearest'}); }
function goFind(h){
  closeFind(); findIn.blur();
  if (h.room){ boxAround(h.room.bbox, 300); if (h.room.level && LEVEL[h.room.level]){ st.level = h.room.level; markLevels(); } return; }
  selectEl(h.part.i, true);
}
findIn.addEventListener('input', showFind);
findIn.addEventListener('focus', () => { if (findIn.value.trim()) showFind(); });
findIn.addEventListener('keydown', e => {
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && findHits.length){ e.preventDefault(); findOn = (findOn + (e.key === 'ArrowDown' ? 1 : -1) + findHits.length) % findHits.length; markFind(); }
  if (e.key === 'Enter' && findHits[findOn]){ e.preventDefault(); goFind(findHits[findOn]); }
  if (e.key === 'Escape') closeFind();
});
findIn.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== findIn) closeFind(); }, 150));
findList.addEventListener('pointerdown', e => e.preventDefault());      // keeps focus in the box while choosing
findList.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) goFind(findHits[+b.dataset.k]); });

/* ---------- report downloads ---------- */
const REPORTS = [
  {name:'Clash report', fmt:'PDF', n:() => SVC_CL.length, run:clashPDF},
  {name:'Builders’ work report', fmt:'Excel', n:() => OPEN.length, run:bwhXLSX},
  ...EQ_REPORTS.map(r => ({name:r.name, fmt:'Excel', n:() => equipOf(r).length, run:() => equipXLSX(r)}))];
const repBtn = $('#repBtn'), repMenu = $('#repMenu');
function closeReports(){ repMenu.style.display = 'none'; repBtn.setAttribute('aria-expanded', 'false'); }
repBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (repMenu.style.display === 'block') return closeReports();
  repMenu.innerHTML = REPORTS.map((r, k) => { const n = r.n();
    return `<button role="menuitem" data-rep="${k}"${n ? '' : ' disabled'}><span>${esc(r.name)}</span><small>${n ? fmt(n) + ' · ' + r.fmt : 'None in this model'}</small></button>`; }).join('');
  repMenu.style.display = 'block';
  const b = repBtn.getBoundingClientRect();
  repMenu.style.left = Math.max(8, Math.min(b.right - repMenu.offsetWidth, innerWidth - repMenu.offsetWidth - 8)) + 'px'; repMenu.style.top = (b.bottom + 4) + 'px';
  repBtn.setAttribute('aria-expanded', 'true'); repMenu.querySelector('button:not(:disabled)')?.focus();
});
repMenu.addEventListener('click', e => { const b = e.target.closest('[data-rep]'); if (!b || b.disabled) return; closeReports(); REPORTS[+b.dataset.rep].run(); });
repMenu.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeReports(); repBtn.focus(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); const bs = [...repMenu.querySelectorAll('button:not(:disabled)')], k = bs.indexOf(document.activeElement);
    bs[(k + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length]?.focus(); }
});
document.addEventListener('click', e => { if (!repMenu.contains(e.target)) closeReports(); });

/* ---------- go ---------- */
buildLayers(); buildDim(); buildClipUI(); buildParts(); buildDiag(); buildTitle(); renderOpenings(); renderClashes(); renderSel(); applyClip(); applyTheme();
buildLevels(); renderViews();
if (mobile()){ app.classList.remove('noleft','noright'); st.tags = 'off'; $('#tagSel').value = 'off'; st.markers = 'off'; $('#mkSel').value = 'off'; }
syncPanelBtns();
resize(); refresh();
const startBox = new THREE.Box3(W0.clone(), W1.clone());
{ const fb = frameBox(startBox, new THREE.Vector3(...VIEWS.iso).normalize()); controls.target.copy(fb.c); persp.position.copy(fb.pos); controls.update(); }
loading.remove();
openShared();
window.__viewer = {st, E, OPEN, CL, fireFor, selectEl, selectClash, setView, setProjection, applyExplode, req, setBox, descOf, clashText, TRIAGE, handles, camera:() => cam,
  controls, LEVELS, VERSION, gridRef, previewLevel, endPreview, pickLevel, zoomBy, findResults, captureState, applyState, saveView, viewLink, clashPDF, bwhXLSX, equipXLSX, equipOf, EQ_REPORTS};
requestAnimationFrame(frame);
})();
</script>
</body>
